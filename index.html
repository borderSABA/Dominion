</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="logo">DOMINION <span class="ver">ONLINE v0.20</span></div>
    <div id="topTurnCenter" class="topTurnCenter">

      <button class="tabbtn" data-panel="logPanel">ログ</button>

  <section id="titleScreen" class="screen active">
    <div class="titleCard">
      <div class="ver">ONLINE BUILD v0.20</div>
      <h1>DOMINION</h1>
      <p>
        4つの固定ルームで遊ぶオンライン版です。CPUを追加すれば1人でも開始できます。<br>
        使用セットの指定に加えて、王国カードを最大10枚まで直接固定できます。
      </p>
      <div id="onlineTitleUi"></div>
    </div>
  </section>

  <section id="roomScreen" class="screen">
    <div class="roomBody">
      <div id="gamePanel" class="panelView active">
        <div id="lobbyBox" class="titleCard" style="width:100%;max-width:none;padding:18px">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <h2 id="onlineRoomTitle" style="margin:0">ルーム</h2>
            <span id="onlineConn" class="notice">未接続</span>
            <button id="leaveOnlineRoom" class="smallbtn" style="margin-left:auto">ロビー退出</button>
          </div>
          <div id="onlineSeats" class="onlineSeats"></div>
          <div class="onlineLobbyActions">
            <button id="toggleCpuOnline" class="smallbtn">CPUを追加</button>
            <button id="openSetFromLobby" class="smallbtn">セットを選ぶ</button>
            <button id="openCustomCards" class="smallbtn">好きなカード</button>
            <button id="rerollSupply" class="smallbtn">サプライ再抽選</button>
            <button id="resetOnlineRoom" class="danger smallbtn">部屋を初期化</button>
            <button id="startGame" class="mainbtn">ゲーム開始</button>
          </div>
          <div id="customKingdomStatus" class="notice" style="margin-top:10px"></div>
          <div id="supplyPreview" style="margin-top:10px;color:#d8d3b8;line-height:1.65"></div>
        </div>

        <div id="activeGame" style="display:none;flex:1;min-height:0;flex-direction:column;gap:7px">
          <div class="playerStrip">
            <div id="humanBox" class="playerBox" data-player="0">
              <div><div class="pName">あなた</div><div id="humanStats" class="pStats"></div></div>
            </div>
            <div class="turnCenter legacyTurnCenter" aria-hidden="true"></div>
            <div id="cpuBox" class="playerBox" data-player="1">
              <div><div class="pName">CPU</div><div id="cpuStats" class="pStats"></div></div>
            </div>
          </div>

          <div id="landscapeStrip" class="landscapeStrip"></div>
          <div class="supplyWrap">
            <div id="baseSupply" class="baseSupply"></div>
            <div id="kingdomSupply" class="kingdomSupply"></div>

          <div class="lowerBoard">
            <div class="deckZone">
              <div class="deckZoneTitle">山札</div>
              <div id="deckCountBig" class="deckCountBig">×00</div>

            </div>
            <div class="rightLower">
              <div class="playArea">
                <div class="playHeader">
                  <strong>プレイカード</strong>
                  <span id="playCount" class="notice"></span>

                <div class="handBody">
                  <div id="handCards" class="handCards"></div>
                  <div class="discardZone">
                    <div class="discardTitle">捨て札</div>

      <div id="setPanel" class="panelView">
        <div>
          <h2 style="margin:0 0 5px">使用セット</h2>
          <div class="notice">チェックしたセットから王国カード10山を選出し、該当するランドスケープ・特殊山札も準備します。</div><div id="catalogStat" class="catalogStat"></div>
        </div>
        <div id="setGrid" class="setGrid"></div>
        <div class="setFooter">
          <button id="applySets" class="mainbtn">このセットを適用</button><button id="openCustomCardsSet" class="smallbtn">好きなカードを選択</button>

      <div id="logPanel" class="panelView"></div>

</div>

    <h2 id="resultTitle">ゲーム終了</h2>

      <button id="viewBoard" class="smallbtn">盤面を見る</button>
      <button id="backLobby" class="mainbtn">ルームへ戻る</button>
    </div>
  </div>
</div>

<script src="expansions-data.js"></script>
<script>
"use strict";

const SETS = [
  {name:"基本", enabled:true, note:"第二版 26種"},
  {name:"陰謀", enabled:true, note:"第二版 26種"},
  {name:"海辺", enabled:true, note:"第二版 27種"},
  {name:"錬金術", enabled:true, note:"12種"},
  {name:"繁栄", enabled:true, note:"第二版 25種"},
  {name:"収穫祭＆ギルド", enabled:true, note:"第二版 26種"},
  {name:"異郷", enabled:true, note:"第二版 26種"},
  {name:"暗黒時代", enabled:true, note:"35種"},
  {name:"冒険", enabled:true, note:"30山"},
  {name:"帝国", enabled:true, note:"24山"},
  {name:"夜想曲", enabled:true, note:"33種"},
  {name:"ルネサンス", enabled:true, note:"25種"},
  {name:"移動動物園", enabled:true, note:"30種"},
  {name:"同盟", enabled:true, note:"31山"},
  {name:"略奪", enabled:true, note:"40種"},
  {name:"旭日", enabled:true, note:"25種"}
];

const C = (name,cost,types,set,text,effect=null,score=null,meta={}) => ({name,cost,types,set,text,effect,score,meta});
const CARDS = {};
const add = c => CARDS[c.name]=c;

[
C("銅貨",0,["財宝"],"基本","+1コイン"),
C("銀貨",3,["財宝"],"基本","+2コイン"),
C("金貨",6,["財宝"],"基本","+3コイン"),
C("屋敷",2,["勝利点"],"基本","+1勝利点",null,()=>1),
C("公領",5,["勝利点"],"基本","+3勝利点",null,()=>3),
C("属州",8,["勝利点"],"基本","+6勝利点",null,()=>6),
C("呪い",0,["呪い"],"基本","-1勝利点",null,()=>-1),

C("地下貯蔵庫",2,["アクション"],"基本","+1アクション。手札から好きな枚数を捨て札にし、捨て札にした枚数と同じ枚数のカードを引く。","cellar"),
C("礼拝堂",2,["アクション"],"基本","手札から最大4枚までのカードを廃棄する。","chapel"),
C("堀",2,["アクション","リアクション"],"基本","+2カード。他のプレイヤーがアタックカードを使用したとき、手札から公開するとそのアタックの影響を受けない。","moat"),
C("前駆者",3,["アクション"],"基本","+1カード +1アクション。捨て札の山を見て、その中のカード1枚をデッキの上に置いてもよい。","harbinger"),
C("商人",3,["アクション"],"基本","+1カード +1アクション。このターン最初に銀貨を使用したとき、+1コイン。","merchant"),
C("家臣",3,["アクション"],"基本","+2コイン。デッキの一番上のカードを捨て札にする。それがアクションカードなら使用してもよい。","vassal"),
C("村",3,["アクション"],"基本","+1カード +2アクション。","village"),
C("工房",3,["アクション"],"基本","コスト4コイン以下のカード1枚を獲得する。","workshop"),
C("役人",4,["アクション","アタック"],"基本","銀貨1枚を獲得してデッキの上に置く。他の各プレイヤーは手札から勝利点カード1枚を公開してデッキの上に置く。","bureaucrat"),
C("庭園",4,["勝利点"],"基本","デッキ10枚につき+1勝利点（端数切り捨て）。",null,p=>Math.floor(allCards(p).length/10)),
C("民兵",4,["アクション","アタック"],"基本","+2コイン。他の各プレイヤーは手札が3枚になるまでカードを捨て札にする。","militia"),
C("金貸し",4,["アクション"],"基本","手札から銅貨1枚を廃棄してもよい。そうした場合、+3コイン。","moneylender"),
C("密猟者",4,["アクション"],"基本","+1カード +1アクション +1コイン。空になっているサプライの山1つにつき手札1枚を捨て札にする。","poacher"),
C("改築",4,["アクション"],"基本","手札からカード1枚を廃棄する。そのカードよりコストが最大2コイン高いカード1枚を獲得する。","remodel"),
C("鍛冶屋",4,["アクション"],"基本","+3カード。","smithy"),
C("玉座の間",4,["アクション"],"基本","手札からアクションカード1枚を選び、そのカードを2回使用する。","throneroom"),
C("山賊",5,["アクション","アタック"],"基本","金貨1枚を獲得する。他の各プレイヤーはデッキの上2枚を公開し、銅貨以外の財宝1枚を廃棄して残りを捨て札にする。","bandit"),
C("議事堂",5,["アクション"],"基本","+4カード +1購入。他の各プレイヤーはカード1枚を引く。","council"),
C("祝祭",5,["アクション"],"基本","+2アクション +1購入 +2コイン。","festival"),
C("研究所",5,["アクション"],"基本","+2カード +1アクション。","laboratory"),
C("書庫",5,["アクション"],"基本","手札が7枚になるまでカードを引く。引いたアクションカードは脇に置いてもよく、最後に脇に置いたカードを捨て札にする。","library"),
C("市場",5,["アクション"],"基本","+1カード +1アクション +1購入 +1コイン。","market"),
C("鉱山",5,["アクション"],"基本","手札から財宝カード1枚を廃棄してもよい。そのカードよりコストが最大3コイン高い財宝カード1枚を手札に獲得する。","mine"),
C("衛兵",5,["アクション"],"基本","+1カード +1アクション。デッキの上2枚を見て、好きな枚数を廃棄、好きな枚数を捨て札にし、残りを好きな順番でデッキの上に戻す。","sentry"),
C("魔女",5,["アクション","アタック"],"基本","+2カード。他の各プレイヤーは呪い1枚を獲得する。","witch"),
C("職人",6,["アクション"],"基本","コスト5コイン以下のカード1枚を手札に獲得する。その後、手札1枚をデッキの上に置く。","artisan"),

C("中庭",2,["アクション"],"陰謀","+3カード。その後、手札1枚をデッキの上に置く。","courtyard"),
C("手先",2,["アクション"],"陰謀","+1カード、+1アクション、+1購入、+1コインから異なる2つを選ぶ。","pawn"),
C("執事",3,["アクション"],"陰謀","+2カード、+2コイン、手札2枚を廃棄、のいずれか1つを選ぶ。","steward"),
C("男爵",4,["アクション"],"陰謀","+1購入。手札から屋敷1枚を捨て札にして+4コインを得てもよい。捨て札にしなかった場合は屋敷1枚を獲得する。","baron"),
C("橋",4,["アクション"],"陰謀","+1購入 +1コイン。このターン、すべてのカードのコストは1コイン少なくなる（0未満にはならない）。","bridge"),
C("共謀者",4,["アクション"],"陰謀","+2コイン。このターンに使用したアクションカードがこれを含め3枚以上なら、+1カード +1アクション。","conspirator"),
C("鉄工所",4,["アクション"],"陰謀","コスト4コイン以下のカード1枚を獲得する。獲得カードの種類に応じて追加効果を得る。","ironworks"),
C("鉱山の村",4,["アクション"],"陰謀","+1カード +2アクション。このカードを廃棄して+2コインを得てもよい。","miningvillage"),
C("パトロール",5,["アクション"],"陰謀","+3カード。デッキの上4枚を公開し、勝利点カードと呪いを手札に加え、残りを好きな順番でデッキの上に戻す。","patrol"),
C("公爵",5,["勝利点"],"陰謀","自分のデッキにある公領1枚につき+1勝利点。",null,p=>allCards(p).filter(n=>n==="公領").length),
 ].forEach(add);

// Current expansion card database loaded from expansions-data.js.
for(const [setName,rows] of Object.entries(window.DOMINION_EXPANSIONS||{})){
  for(const row of rows){
    const [name,cost,types,text,meta={}] = row;
    const old=CARDS[name];
    add(C(name,cost,types,setName,text,"generic",old?.score||null,meta));
  }
}

const KINGDOM_BY_SET = {
  "基本":["地下貯蔵庫","礼拝堂","堀","前駆者","商人","家臣","村","工房","役人","庭園","民兵","金貸し","密猟者","改築","鍛冶屋","玉座の間","山賊","議事堂","祝祭","研究所","書庫","市場","鉱山","衛兵","魔女","職人"]
};
for(const [setName,rows] of Object.entries(window.DOMINION_EXPANSIONS||{})) KINGDOM_BY_SET[setName]=rows.map(r=>r[0]);

const state = {
  inGame:false, turn:0, phase:"action", actions:1, buys:1, coins:0, potions:0,
  selectedSets:new Set(["基本"]), kingdom:[], supply:{}, trash:[],
  players:[], logs:[], costReduction:0, merchantBonus:0, actionsPlayed:0, busy:false, treasuresCommitted:false, supplyPick:null
};

function newPlayer(name,isCPU){
  return {name,isCPU,deck:[],discard:[],hand:[],play:[],duration:[],exile:[],trash:[],vpTokens:0,coffers:0,villagers:0,favors:0,debt:0,sun:0,lastPlayedDiscard:null};
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function allCards(p){ return [...p.deck,...p.discard,...p.hand,...p.play,...(p.duration||[]),...(p.exile||[])]; }
function cardCost(name){ return Math.max(0,(CARDS[name]?.cost||0)-state.costReduction); }
function cardCostLabel(name){
  const c=CARDS[name],m=c?.meta||{}; if(!c)return "?";
  if(m.debtCost)return `◇${m.debtCost}`;
  let s=String(cardCost(name)); if(m.potionCost)s+=`+P`; return s;
}
function typeHas(name,t){ return CARDS[name].types.includes(t); }
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function log(msg){ state.logs.unshift(msg); if(state.logs.length>250) state.logs.length=250; renderLog(); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1200); }
let pointPopQueue=Promise.resolve();
function showPointPop(p,delta){
  if(!delta)return;
  pointPopQueue=pointPopQueue.then(()=>new Promise(resolve=>{
    const el=document.getElementById("centerPop");
    el.textContent=`${p.name} ${delta>0?"+":""}${delta}点`;
    el.classList.add("show");
    setTimeout(()=>el.classList.remove("show"),1250);
    setTimeout(resolve,1450);
  }));
}

function drawOne(p){
  if(!p.deck.length){
    if(!p.discard.length) return null;
    p.deck = shuffle(p.discard.splice(0));
  }
  const c=p.deck.pop(); p.hand.push(c); return c;
}
function draw(p,n){ for(let i=0;i<n;i++) if(!drawOne(p)) break; }
function takeTop(p){
  if(!p.deck.length && p.discard.length) p.deck=shuffle(p.discard.splice(0));
  return p.deck.length?p.deck.pop():null;
}
function setupPlayers(){
  state.players=[newPlayer("あなた",false),newPlayer("CPU",true)];
  for(const p of state.players){
    p.deck=shuffle([...Array(7).fill("銅貨"),...Array(3).fill("屋敷")]);
    p.discard=[];p.hand=[];p.play=[];p.duration=[];p.exile=[];p.trash=[];p.vpTokens=0;p.coffers=0;p.villagers=0;p.favors=0;p.debt=0;p.sun=0;p.lastPlayedDiscard=null;draw(p,5);
  }
}
function buildSupply(){
  const pool=[...state.selectedSets].flatMap(s=>KINGDOM_BY_SET[s]||[]);
  const uniq=[...new Set(pool)];
  if(uniq.length<10){ toast("実装カードが10種類未満です"); return false; }
  state.kingdom=shuffle([...uniq]).slice(0,10);
  state.supply={"銅貨":46,"銀貨":40,"金貨":30,"屋敷":8,"公領":8,"属州":8,"呪い":10};
  if(state.selectedSets.has("錬金術")){
    if(!CARDS["ポーション"])add(C("ポーション",4,["財宝"],"錬金術","+1ポーション","generic",null,{treasurePotions:1}));
    state.supply["ポーション"]=16;
  }
  if(state.selectedSets.has("繁栄")){
    if(!CARDS["白金貨"])add(C("白金貨",9,["財宝"],"繁栄","+5コイン","generic",null,{treasureCoins:5}));
    if(!CARDS["植民地"])add(C("植民地",11,["勝利点"],"繁栄","+10勝利点","generic",()=>10,{}));
    state.supply["白金貨"]=12;state.supply["植民地"]=8;
  }
  if(state.selectedSets.has("移動動物園")){
    if(!CARDS["馬"])add(C("馬",3,["アクション"],"移動動物園","+2カード｜+1アクション｜使用後、馬の山へ戻る","generic",null,{draw:2,actions:1,returnToSupply:true}));
    state.supply["馬"]=30;
  }
  if(state.selectedSets.has("暗黒時代")){
    if(!CARDS["廃墟"])add(C("廃墟",0,["アクション","廃墟"],"暗黒時代","廃墟の混成山札","generic"));
    state.supply["廃墟"]=10;
  }
  for(const n of state.kingdom) state.supply[n]=typeHas(n,"勝利点")?8:10;
  renderSupplyPreview();
  return true;
}
function emptyPiles(){ return Object.values(state.supply).filter(v=>v===0).length; }

function startGame(){
  if(!buildSupply()) return;
  setupPlayers(); state.trash=[];state.logs=[];state.inGame=true;state.turn=0;
  document.getElementById("lobbyBox").style.display="none";
  document.getElementById("activeGame").style.display="flex";
  log("<b>ゲーム開始</b>：あなたが先手です。");
  startTurn();
}
function applyMetaResources(p,m){
  if(!m)return;
  if(m.draw)draw(p,m.draw);
  if(m.actions)state.actions+=m.actions;
  if(m.buys)state.buys+=m.buys;
  if(m.coins)state.coins+=m.coins;
  if(m.coffers)p.coffers+=m.coffers;
  if(m.villagers)p.villagers+=m.villagers;
  if(m.favors)p.favors+=m.favors;
  if(m.sun)p.sun+=m.sun;
  if(m.debtOnPlay)p.debt+=m.debtOnPlay;
  if(m.vpTokens){const before=score(p);p.vpTokens+=m.vpTokens;const after=score(p);if(after!==before)showPointPop(p,after-before);}
}
function resolveStartEffects(p){
  const old=[...(p.duration||[])];p.duration=[];
  for(const n of old){
    const m=CARDS[n]?.meta||{};
    applyMetaResources(p,{draw:m.nextDraw||0,actions:m.nextActions||0,buys:m.nextBuys||0,coins:m.nextCoins||0});
    p.discard.push(n);
  }
  for(const n of allCards(p)){
    const m=CARDS[n]?.meta||{};
    if(m.permanentDraw)draw(p,m.permanentDraw);
    if(m.permanentCoins)state.coins+=m.permanentCoins;
  }
}
function startTurn(){
  if(checkGameEnd()) return;
  state.phase="action";state.actions=1;state.buys=1;state.coins=0;state.potions=0;state.costReduction=0;state.merchantBonus=0;state.actionsPlayed=0;state.busy=false;state.treasuresCommitted=false;state.supplyPick=null;
  const p=state.players[state.turn];
  resolveStartEffects(p);
  log(`<b>${p.name}</b> のターン`);
  render();
  if(p.isCPU) cpuTurn();
}
function cleanup(p){
  if(p.play.length)p.lastPlayedDiscard=p.play[p.play.length-1];
  p.discard.push(...p.hand.splice(0));
  for(const n of p.play.splice(0)){
    const m=CARDS[n]?.meta||{};
    if(m.nextDraw||m.nextActions||m.nextBuys||m.nextCoins)p.duration.push(n);
    else if(m.returnToSupply && state.supply[n]!=null)state.supply[n]++;
    else p.discard.push(n);
  }
  draw(p,5);
}
function endCurrentTurn(){
  if(state.busy) return;
  const p=state.players[state.turn];
  cleanup(p);
  state.turn=1-state.turn;
  startTurn();
}
function checkGameEnd(){
  if(!state.inGame) return false;
  if(state.supply["属州"]===0 || (Object.prototype.hasOwnProperty.call(state.supply,"植民地")&&state.supply["植民地"]===0) || emptyPiles()>=3){ finishGame(); return true; }
  return false;
}
function score(p){
  let total=p.vpTokens||0;
  const cards=allCards(p);
  for(const n of cards){
    const c=CARDS[n];if(!c)continue;
    if(c.score)total+=c.score(p);
    else{
      const m=c.meta||{};
      if(m.fixedVp)total+=m.fixedVp;
      if(m.vpDuchy)total+=cards.filter(x=>x==="公領").length*m.vpDuchy;
      if(m.vpActions)total+=Math.floor(cards.filter(x=>CARDS[x]?.types?.includes("アクション")).length/m.vpActions);
      if(m.vpSilver3)total+=Math.floor(cards.filter(x=>x==="銀貨").length/3)*m.vpSilver3;
      if(m.vpUnique5)total+=Math.floor(new Set(cards).size/5)*m.vpUnique5;
    }
  }
  return total;
}
function finishGame(){
  state.inGame=false;
  const a=score(state.players[0]), b=score(state.players[1]);
  document.getElementById("resultTitle").textContent=a>b?"あなたの勝利":a<b?"CPUの勝利":"引き分け";
  document.getElementById("resultScores").innerHTML=
    `<div class="scoreRow"><span>あなた</span><b>${a} VP</b></div><div class="scoreRow"><span>CPU</span><b>${b} VP</b></div>`;
  document.getElementById("result").classList.add("show");
  log(`<b>ゲーム終了</b> あなた ${a}VP / CPU ${b}VP`);
}

function gain(p,name,dest="discard"){
  if((state.supply[name]??0)<=0) return false;
  const before=score(p);
  state.supply[name]--;
  p[dest].push(name);
  const after=score(p);
  log(`${p.name} が <b>${name}</b> を獲得`);
  if(after!==before)showPointPop(p,after-before);
  return true;
}
function trashFrom(p,zone,index){
  const before=score(p);
  const arr=p[zone]; const [n]=arr.splice(index,1);
  if(n){
    state.trash.push(n);p.trash.push(n);log(`${p.name} が <b>${n}</b> を廃棄`);
    const after=score(p);if(after!==before)showPointPop(p,after-before);
  }
  return n;
}
function discardFrom(p,index){ const [n]=p.hand.splice(index,1); if(n)p.discard.push(n); return n; }
function moveHandToPlay(p,index){ const [n]=p.hand.splice(index,1); if(n)p.play.push(n); return n; }

function hasMoat(p){ return p.hand.includes("堀"); }
function attackBlocked(p){
  if(hasMoat(p)){ log(`${p.name} は <b>堀</b> を公開してアタックを防いだ`); return true; }
  return false;
}

async function playActionFromHand(p,index,free=false){
  const name=p.hand[index];
  if(!name || !typeHas(name,"アクション")) return;
  if(!free){
    if(state.phase!=="action" || state.actions<=0) return;
    state.actions--;
  }
  moveHandToPlay(p,index);
  state.actionsPlayed++;
  log(`${p.name} が <b>${name}</b> を使用`);
  render();
  await resolveEffect(p,name);
}
async function playActionByNameFromHand(p,name,free=true){
  const idx=p.hand.indexOf(name); if(idx<0)return false;
  await playActionFromHand(p,idx,free); return true;
}

async function genericDiscard(p,count){
  count=Math.min(count||0,p.hand.length);if(count<=0)return;
  if(p.isCPU){
    for(let k=0;k<count;k++){const x=p.hand.map((n,i)=>({i,v:keepValue(n)})).sort((a,b)=>a.v-b.v)[0];if(x)discardFrom(p,x.i);}
  }else{
    const sel=await chooseCardsModal("カードを捨てる",`${count}枚選択`,p.hand,count,count);
    for(const i of [...sel].sort((a,b)=>b-a))discardFrom(p,i);
  }
}
async function genericAttackDiscardTo(p,targetCount){
  const o=other(p);if(attackBlocked(o))return;const need=Math.max(0,o.hand.length-targetCount);if(need)await genericDiscard(o,need);
}
async function resolveGeneric(p,c){
  const m=c.meta||{};applyMetaResources(p,m);
  if(m.gainFixed)for(const n of m.gainFixed){if(state.supply[n]>0)gain(p,n);}
  if(m.discard)await genericDiscard(p,m.discard);
  if(m.trash){const n=Math.min(m.trash,p.hand.length);if(n)await chooseTrashHand(p,n,n,`${c.name}：廃棄`);}
  if(m.curseOther&&!attackBlocked(other(p)))for(let i=0;i<m.curseOther;i++)gain(other(p),"呪い");
  if(m.attackDiscardTo!=null)await genericAttackDiscardTo(p,m.attackDiscardTo);
  if(m.gainMax!=null){const f=m.gainType?(n=>typeHas(n,m.gainType)):(()=>true);await gainChoice(p,m.gainMax,f,m.gainDest||"discard",`${c.name}：対象カードを獲得`);}
}
async function resolveEffect(p,name){
  const e=CARDS[name].effect;
  switch(e){
    case "cellar": state.actions++; await chooseDiscardDraw(p); break;
    case "chapel": await chooseTrashHand(p,0,4,"最大4枚まで廃棄"); break;
    case "moat": draw(p,2); break;
    case "harbinger": draw(p,1);state.actions++;await harbinger(p);break;
    case "merchant": draw(p,1);state.actions++;state.merchantBonus++;break;
    case "vassal": state.coins+=2;await vassal(p);break;
    case "village": draw(p,1);state.actions+=2;break;
    case "workshop": await gainChoice(p,4,()=>true,"discard","工房：4コイン以下を1枚獲得");break;
    case "bureaucrat": gain(p,"銀貨","deck");await bureaucratAttack(p);break;
    case "militia": state.coins+=2;await militiaAttack(p);break;
    case "moneylender": await moneylender(p);break;
    case "poacher": draw(p,1);state.actions++;state.coins++;await poacher(p);break;
    case "remodel": await remodel(p);break;
    case "smithy": draw(p,3);break;
    case "throneroom": await throneRoom(p);break;
    case "bandit": gain(p,"金貨");await banditAttack(p);break;
    case "council": draw(p,4);state.buys++;draw(other(p),1);break;
    case "festival": state.actions+=2;state.buys++;state.coins+=2;break;
    case "laboratory": draw(p,2);state.actions++;break;
    case "library": await library(p);break;
    case "market": draw(p,1);state.actions++;state.buys++;state.coins++;break;
    case "mine": await mine(p);break;
    case "sentry": draw(p,1);state.actions++;await sentry(p);break;
    case "witch": draw(p,2);if(!attackBlocked(other(p))) gain(other(p),"呪い");break;
    case "artisan": await artisan(p);break;

    case "courtyard": draw(p,3);await topdeckChoice(p,"手札から1枚を山札の上へ");break;
    case "pawn": await pawn(p);break;
    case "steward": await steward(p);break;
    case "baron": state.buys++;await baron(p);break;
    case "bridge": state.buys++;state.coins++;state.costReduction++;break;
    case "conspirator": state.coins+=2;if(state.actionsPlayed>=3){draw(p,1);state.actions++;}break;
    case "ironworks": await ironworks(p);break;
    case "miningvillage": draw(p,1);state.actions+=2;await miningVillage(p);break;
    case "patrol": await patrol(p);break;
    case "generic": await resolveGeneric(p,CARDS[name]);break;
    default: if(CARDS[name]?.meta)await resolveGeneric(p,CARDS[name]);break;
  }
  render();
}
function other(p){return state.players[0]===p?state.players[1]:state.players[0];}

async function chooseDiscardDraw(p){
  if(p.isCPU){
    const inds=p.hand.map((n,i)=>({n,i})).filter(x=>typeHas(x.n,"勝利点")||x.n==="呪い").map(x=>x.i).reverse();
    const k=inds.length; for(const i of inds) discardFrom(p,i); draw(p,k); return;
  }
  const sel=await chooseCardsModal("地下貯蔵庫","捨てるカードを好きな枚数選択",p.hand,0,p.hand.length);
  const names=sel.map(i=>p.hand[i]); const sorted=[...sel].sort((a,b)=>b-a); for(const i of sorted)discardFrom(p,i); draw(p,sel.length);
}
async function chooseTrashHand(p,min,max,title){
  if(!p.hand.length)return;
  if(p.isCPU){
    let ranked=p.hand.map((n,i)=>({n,i,score:trashPriority(n)})).sort((a,b)=>b.score-a.score).slice(0,max).filter(x=>x.score>0);
    for(const i of ranked.map(x=>x.i).sort((a,b)=>b-a))trashFrom(p,"hand",i);return;
  }
  const sel=await chooseCardsModal(title,"廃棄するカードを選択",p.hand,min,Math.min(max,p.hand.length));
  for(const i of [...sel].sort((a,b)=>b-a))trashFrom(p,"hand",i);
}
function trashPriority(n){ if(n==="呪い")return 100;if(n==="屋敷")return 90;if(n==="銅貨")return 70;if(n==="公領")return 20;return 0; }
async function harbinger(p){
  if(!p.discard.length)return;
  if(p.isCPU){
    const best=[...p.discard].map((n,i)=>({n,i,v:buyValue(n)})).sort((a,b)=>b.v-a.v)[0];
    if(best&&best.v>4)p.deck.push(p.discard.splice(best.i,1)[0]); return;
  }
  const sel=await chooseCardsModal("前駆者","山札の上に戻す捨て札を0～1枚選択",p.discard,0,1);
  if(sel.length)p.deck.push(p.discard.splice(sel[0],1)[0]);
}
async function vassal(p){
  const n=takeTop(p);if(!n)return;p.discard.push(n);log(`${p.name} の家臣：<b>${n}</b> を捨て札へ`);
  if(typeHas(n,"アクション")){
    if(p.isCPU){
      p.discard.splice(p.discard.lastIndexOf(n),1);p.hand.push(n);await playActionByNameFromHand(p,n,true);
    } else {
      const yes=await optionModal("家臣",`${n} を使用しますか？`,["使用する","捨て札のまま"]);
      if(yes===0){p.discard.splice(p.discard.lastIndexOf(n),1);p.hand.push(n);await playActionByNameFromHand(p,n,true);}
    }
  }
}
function boardSupplyChoice(title,choices){
  return new Promise(resolve=>{
    state.supplyPick={title,choices:new Set(choices),resolve};
    render();
    const phase=document.getElementById("phaseLabel");
    if(phase)phase.textContent=title;
    toast("光っているカードを盤面から選択");
  });
}
async function gainChoice(p,maxCost,filter=()=>true,dest="discard",title="獲得するカードを選択"){
  const choices=Object.keys(state.supply).filter(n=>state.supply[n]>0 && cardCost(n)<=maxCost && filter(n));
  if(!choices.length)return null;
  let name;
  if(p.isCPU) name=[...choices].sort((a,b)=>buyValue(b)-buyValue(a))[0];
  else name=await boardSupplyChoice(title,choices);
  if(name){gain(p,name,dest);render();return name;} return null;
}
async function bureaucratAttack(p){
  const o=other(p);if(attackBlocked(o))return;
  const wins=o.hand.map((n,i)=>({n,i})).filter(x=>typeHas(x.n,"勝利点"));
  if(!wins.length){log(`${o.name} は勝利点カードを持っていない`);return;}
  let idx;
  if(o.isCPU) idx=wins.sort((a,b)=>CARDS[a.n].cost-CARDS[b.n].cost)[0].i;
  else {const sel=await chooseCardsModal("役人の攻撃","山札の上に置く勝利点カードを1枚選択",o.hand,1,1, i=>typeHas(o.hand[i],"勝利点"));idx=sel[0];}
  o.deck.push(o.hand.splice(idx,1)[0]);
}
async function militiaAttack(p){
  const o=other(p);if(attackBlocked(o))return;
  const need=Math.max(0,o.hand.length-3);if(!need)return;
  if(o.isCPU){
    for(let k=0;k<need;k++){let idx=o.hand.map((n,i)=>({i,v:keepValue(n)})).sort((a,b)=>a.v-b.v)[0].i;discardFrom(o,idx);}
  }else{
    const sel=await chooseCardsModal("民兵の攻撃",`手札が3枚になるよう ${need}枚 捨ててください`,o.hand,need,need);
    for(const i of [...sel].sort((a,b)=>b-a))discardFrom(o,i);
  }
}
async function moneylender(p){
  const idx=p.hand.indexOf("銅貨");if(idx<0)return;
  if(p.isCPU){trashFrom(p,"hand",idx);state.coins+=3;return;}
  const op=await optionModal("金貸し","銅貨を1枚廃棄して+3コイン？",["廃棄する","しない"]);
  if(op===0){trashFrom(p,"hand",p.hand.indexOf("銅貨"));state.coins+=3;}
}
async function poacher(p){
  let n=Math.min(emptyPiles(),p.hand.length);if(!n)return;
  if(p.isCPU){for(let k=0;k<n;k++){let idx=p.hand.map((x,i)=>({i,v:keepValue(x)})).sort((a,b)=>a.v-b.v)[0].i;discardFrom(p,idx);}}
  else {const sel=await chooseCardsModal("密猟者",`空の山札が${n}つあります。${n}枚捨てます。`,p.hand,n,n);for(const i of [...sel].sort((a,b)=>b-a))discardFrom(p,i);}
}
async function remodel(p){
  if(!p.hand.length)return;
  let idx;
  if(p.isCPU) idx=p.hand.map((n,i)=>({i,v:trashPriority(n)+CARDS[n].cost})).sort((a,b)=>b.v-a.v)[0].i;
  else idx=(await chooseCardsModal("改築","廃棄するカードを1枚選択",p.hand,1,1))[0];
  const trashed=trashFrom(p,"hand",idx);if(trashed) await gainChoice(p,CARDS[trashed].cost+2,()=>true,"discard",`改築：${CARDS[trashed].cost+2}コイン以下を1枚獲得`);
}
async function throneRoom(p){
  const acts=p.hand.filter(n=>typeHas(n,"アクション"));if(!acts.length)return;
  let name=p.isCPU?[...acts].sort((a,b)=>actionPriority(b)-actionPriority(a))[0]:await cardNameModal("玉座の間","2回使用するアクションを選択",acts);
  if(!name)return;
  const idx=p.hand.indexOf(name); moveHandToPlay(p,idx); state.actionsPlayed++;
  log(`${p.name} が玉座の間で <b>${name}</b> を2回使用`);
  await resolveEffect(p,name); state.actionsPlayed++; await resolveEffect(p,name);
}
async function banditAttack(p){
  const o=other(p);if(attackBlocked(o))return;
  const before=score(o);
  const revealed=[];for(let i=0;i<2;i++){const n=takeTop(o);if(n)revealed.push(n);}
  const targets=revealed.filter(n=>typeHas(n,"財宝")&&n!=="銅貨");
  let trashName=null;
  if(targets.length===1)trashName=targets[0];
  else if(targets.length>1){
    if(o.isCPU)trashName=[...targets].sort((a,b)=>CARDS[b].cost-CARDS[a].cost)[0];
    else trashName=await cardNameModal("山賊の攻撃","廃棄する財宝を1枚選択",targets);
  }
  let trashed=false;
  for(const n of revealed){
    if(!trashed && n===trashName){state.trash.push(n);o.trash.push(n);trashed=true;log(`${o.name} の <b>${n}</b> が山賊で廃棄`);}
    else o.discard.push(n);
  }
  const after=score(o);if(after!==before)showPointPop(o,after-before);
}
async function library(p){
  const aside=[];
  while(p.hand.length<7){
    const n=takeTop(p);if(!n)break;
    if(typeHas(n,"アクション")){
      let setAside=false;
      if(p.isCPU) setAside=actionPriority(n)<45;
      else setAside=(await optionModal("書庫",`${n} を脇に置きますか？`,["脇に置く","手札に加える"]))===0;
      if(setAside)aside.push(n);else p.hand.push(n);
    }else p.hand.push(n);
  }
  p.discard.push(...aside);
}
async function mine(p){
  const trs=p.hand.map((n,i)=>({n,i})).filter(x=>typeHas(x.n,"財宝"));
  if(!trs.length)return;
  let idx;
  if(p.isCPU){
    idx=trs.sort((a,b)=>CARDS[a.n].cost-CARDS[b.n].cost)[0].i;
  }else{
    const yes=await optionModal("鉱山","手札の財宝1枚を廃棄しますか？",["廃棄する","しない"]);
    if(yes!==0)return;
    idx=(await chooseCardsModal("鉱山","廃棄する財宝を1枚選択",p.hand,1,1,i=>typeHas(p.hand[i],"財宝")))[0];
  }
  const old=trashFrom(p,"hand",idx);if(!old)return;
  await gainChoice(p,CARDS[old].cost+3,n=>typeHas(n,"財宝"),"hand",`鉱山：${CARDS[old].cost+3}コイン以下の財宝を手札に獲得`);
}
async function sentry(p){
  const before=score(p);
  const reveal=[];for(let i=0;i<2;i++){const n=takeTop(p);if(n)reveal.push(n);}
  if(!reveal.length)return;
  if(p.isCPU){
    const keep=[];
    for(const n of reveal){if(trashPriority(n)>=70){state.trash.push(n);p.trash.push(n);log(`${p.name} は衛兵で <b>${n}</b> を廃棄`);}else keep.push(n);}
    p.deck.push(...keep.reverse());const after=score(p);if(after!==before)showPointPop(p,after-before);return;
  }
  for(let ri=0;ri<reveal.length;ri++){
    const n=reveal[ri];
    const op=await revealedCardOptionModal(
      "衛兵",
      `山札から見たカード ${ri+1}/${reveal.length}`,
      n,
      ["廃棄","捨て札","山札の上"]
    );
    if(op===0){state.trash.push(n);p.trash.push(n);log(`${p.name} は衛兵で <b>${n}</b> を廃棄`);}
    else if(op===1){p.discard.push(n);log(`${p.name} は衛兵で <b>${n}</b> を捨て札へ`);}
    else {p.deck.push(n);log(`${p.name} は衛兵で <b>${n}</b> を山札の上へ`);}
  }
  const after=score(p);if(after!==before)showPointPop(p,after-before);
}
async function artisan(p){
  const n=await gainChoice(p,5,()=>true,"hand","5コスト以下を手札へ獲得");
  if(p.hand.length)await topdeckChoice(p,"手札から1枚を山札の上へ");
}
async function topdeckChoice(p,title){
  if(!p.hand.length)return;
  let idx;
  if(p.isCPU) idx=p.hand.map((n,i)=>({i,v:keepValue(n)})).sort((a,b)=>b.v-a.v)[0].i;
  else idx=(await chooseCardsModal(title,"1枚選択",p.hand,1,1))[0];
  p.deck.push(p.hand.splice(idx,1)[0]);
}
async function pawn(p){
  const opts=["+1カード","+1アクション","+1購入","+1コイン"];
  let chosen;
  if(p.isCPU)chosen=[0,1]; else chosen=await multiOptionModal("手先","異なる2つを選択",opts,2);
  for(const x of chosen){if(x===0)draw(p,1);if(x===1)state.actions++;if(x===2)state.buys++;if(x===3)state.coins++;}
}
async function steward(p){
  let op=p.isCPU?(p.hand.some(n=>trashPriority(n)>=70)?2:0):await optionModal("執事","1つ選択",["+2カード","+2コイン","手札2枚を廃棄"]);
  if(op===0)draw(p,2);else if(op===1)state.coins+=2;else await chooseTrashHand(p,Math.min(2,p.hand.length),2,"執事");
}
async function baron(p){
  const idx=p.hand.indexOf("屋敷");
  if(idx>=0){
    let yes=p.isCPU?true:(await optionModal("男爵","屋敷を捨てて+4コイン？",["捨てる","捨てない"]))===0;
    if(yes){discardFrom(p,idx);state.coins+=4;return;}
  }
  gain(p,"屋敷");
}
async function ironworks(p){
  const name=await gainChoice(p,4,()=>true,"discard","鉄工所：4コイン以下を1枚獲得");if(!name)return;
  if(typeHas(name,"アクション"))state.actions++;
  if(typeHas(name,"財宝"))state.coins++;
  if(typeHas(name,"勝利点"))draw(p,1);
}
async function miningVillage(p){
  const idx=p.play.lastIndexOf("鉱山の村");if(idx<0)return;
  let yes=p.isCPU?(state.coins>=4&&state.coins<6):((await optionModal("鉱山の村","この鉱山の村を廃棄して+2コイン？",["廃棄する","残す"]))===0);
  if(yes){trashFrom(p,"play",idx);state.coins+=2;}
}
async function patrol(p){
  draw(p,3);const revealed=[];for(let i=0;i<4;i++){const n=takeTop(p);if(n)revealed.push(n);}
  const keep=[];for(const n of revealed){if(typeHas(n,"勝利点")||n==="呪い")p.hand.push(n);else keep.push(n);}
  p.deck.push(...keep.reverse());
}

async function playNightFromHand(p,index){
  const name=p.hand[index];if(!name||!typeHas(name,"夜行"))return;moveHandToPlay(p,index);log(`${p.name} が <b>${name}</b> を夜行として使用`);await resolveEffect(p,name);
}
function playTreasure(p,index){
  if(state.phase!=="buy"||state.treasuresCommitted)return;
  const n=p.hand[index];if(!n||!typeHas(n,"財宝"))return;
  moveHandToPlay(p,index);const m=CARDS[n]?.meta||{};
  let val=n==="銅貨"?1:n==="銀貨"?2:n==="金貨"?3:(m.treasureCoins||0);
  if(n==="銀貨"&&state.merchantBonus>0){val+=state.merchantBonus;state.merchantBonus=0;}
  if(m.dynamicTreasure==="philosopher")val=Math.floor((p.deck.length+p.discard.length)/5);
  if(m.dynamicTreasure==="bank")val=p.play.filter(x=>typeHas(x,"財宝")).length;
  if(m.dynamicTreasure==="pendant")val=new Set(p.play.filter(x=>typeHas(x,"財宝")).map(x=>x)).size;
  if(m.dynamicTreasure==="rice")val=new Set(p.play.flatMap(x=>CARDS[x]?.types||[])).size;
  if(m.dynamicTreasure==="foolsGold")val=p.play.filter(x=>x==="愚者の黄金").length===1?1:4;
  state.coins+=val;state.buys+=m.treasureBuys||0;state.potions+=m.treasurePotions||0;
  if(m.coffers)p.coffers+=m.coffers;if(m.favors)p.favors+=m.favors;
  if(m.gainFixed)for(const g of m.gainFixed)if(state.supply[g]>0)gain(p,g);
  log(`${p.name} が <b>${n}</b> を出した (+${val}コイン${m.treasurePotions?` / +${m.treasurePotions}P`:""})`);
  if(!p.hand.some(x=>typeHas(x,"財宝")))state.treasuresCommitted=true;render();
}
function playAllTreasures(){
  if(state.turn!==0||state.busy)return;
  if(state.phase==="action")state.phase="buy";
  state.treasuresCommitted=false;
  const p=state.players[0];
  for(let i=p.hand.length-1;i>=0;i--)if(typeHas(p.hand[i],"財宝"))playTreasure(p,i);
  state.treasuresCommitted=true;payDebt(p);
  render();
}
function nextPhase(){
  if(state.turn!==0||state.busy||state.supplyPick)return;
  if(state.phase==="action"){
    state.phase="buy";
    state.treasuresCommitted=false;
    render();
    return;
  }
  if(state.phase==="buy"&&!state.treasuresCommitted){
    playAllTreasures();
    return;
  }
  endCurrentTurn();
}
function payDebt(p){
  if(!p.debt)return;const pay=Math.min(state.coins,p.debt);if(pay){state.coins-=pay;p.debt-=pay;log(`${p.name} が負債を ${pay} 支払った`);}
}
function canBuyCard(p,name){
  const c=CARDS[name],m=c?.meta||{};if(!c||(state.supply[name]??0)<=0||state.buys<=0||p.debt>0)return false;
  return state.coins>=cardCost(name)&&state.potions>=(m.potionCost||0);
}
function buyCard(p,name){
  if(state.phase!=="buy"||!canBuyCard(p,name))return false;
  const c=CARDS[name],m=c.meta||{};state.coins-=cardCost(name);state.potions-=m.potionCost||0;state.buys--;state.treasuresCommitted=true;gain(p,name);if(m.debtCost)p.debt+=m.debtCost;render();
  if(checkGameEnd())return true;return true;
}

function actionPriority(n){
  const v={村:95,市場:94,研究所:92,祝祭:90,衛兵:88,魔女:86,民兵:84,議事堂:82,鍛冶屋:80,山賊:79,金貸し:75,改築:70,工房:66,礼拝堂:64,地下貯蔵庫:62,前駆者:61,商人:60,家臣:58,役人:55,鉱山:55,職人:53,書庫:52,玉座の間:96,中庭:80,手先:74,執事:72,男爵:70,橋:76,共謀者:78,鉄工所:68,"鉱山の村":94,パトロール:84};
  return v[n]??40;
}
function keepValue(n){
  if(n==="金貨")return 100;if(n==="銀貨")return 75;if(n==="属州")return 50;if(n==="公領")return 35;if(n==="屋敷")return 8;if(n==="呪い")return -30;if(n==="銅貨")return 25;
  return 45+CARDS[n].cost*4+(typeHas(n,"アクション")?10:0);
}
function buyValue(n){
  if(n==="属州")return 500;if(n==="金貨")return 300;if(n==="公領")return 150;if(n==="銀貨")return 120;if(n==="呪い")return -100;
  return 100+CARDS[n].cost*12+(typeHas(n,"アクション")?20:0);
}
async function cpuTurn(){
  state.busy=true;render();await sleep(500);
  const p=state.players[1];
  let guard=0;
  while(state.phase==="action"&&state.actions>0&&guard++<20){
    const acts=p.hand.map((n,i)=>({n,i})).filter(x=>typeHas(x.n,"アクション")).sort((a,b)=>actionPriority(b.n)-actionPriority(a.n));
    if(!acts.length)break;
    await playActionFromHand(p,acts[0].i,false);render();await sleep(330);
  }
  state.phase="buy";state.treasuresCommitted=false;render();await sleep(280);
  for(let i=p.hand.length-1;i>=0;i--)if(typeHas(p.hand[i],"財宝"))playTreasure(p,i);
  state.treasuresCommitted=true;payDebt(p);
  await sleep(330);
  while(state.buys>0){
    const choices=Object.keys(state.supply).filter(n=>canBuyCard(p,n));
    if(!choices.length)break;
    let pick=null;
    if(state.coins>=8&&state.supply["属州"]>0)pick="属州";
    else if(state.supply["属州"]<=4&&state.coins>=5&&state.supply["公領"]>0)pick="公領";
    else if(state.coins>=6&&state.supply["金貨"]>0)pick="金貨";
    else{
      const kingdom=choices.filter(n=>state.kingdom.includes(n)&&!typeHas(n,"勝利点"));
      if(kingdom.length)pick=kingdom.sort((a,b)=>buyValue(b)-buyValue(a))[0];
      else if(state.coins>=3&&state.supply["銀貨"]>0)pick="銀貨";
      else if(state.supply["銅貨"]>0)pick="銅貨";
    }
    if(!pick)break;
    buyCard(p,pick);await sleep(280);if(!state.inGame){state.busy=false;return;}
  }
  state.busy=false;cleanup(p);state.turn=0;startTurn();
}

function effectLineArray(text){
  return String(text||"").replace(/\r?\n/g,"｜").split(/[｜。]/).map(x=>x.trim()).filter(Boolean);
}
function effectLinesHTML(text){
  return `<div class="effectLines">${effectLineArray(text).map(x=>`<div class="effectLine">${formatCardText(x)}</div>`).join("")}</div>`;
}
function formatCardText(text){
  return String(text)
    .replace(/([+-]\d+)\s*コイン/g,'<span class="coinText">$1コイン</span>')
    .replace(/([+-]\d+)\s*勝利点/g,(m,v)=>v.startsWith("-")
      ? `<span class="curseVpText">${v}勝利点</span>`
      : `<span class="vpText">${v}勝利点</span>`);
}
function cardBonusLine(n){
  if(n==="銅貨") return '<span class="coinText">+1コイン</span>';
  if(n==="銀貨") return '<span class="coinText">+2コイン</span>';
  if(n==="金貨") return '<span class="coinText">+3コイン</span>';
  if(n==="白金貨") return '<span class="coinText">+5コイン</span>';
  if(n==="ポーション") return '<span style="color:#111;font-weight:900">+1ポーション</span>';
  if(n==="屋敷") return '<span class="vpText">+1勝利点</span>';
  if(n==="公領") return '<span class="vpText">+3勝利点</span>';
  if(n==="属州") return '<span class="vpText">+6勝利点</span>';
  if(n==="植民地") return '<span class="vpText">+10勝利点</span>';
  if(n==="呪い") return '<span class="curseVpText">-1勝利点</span>';
  return "";
}
function cardClass(n){
  const t=CARDS[n].types;
  if(t.includes("呪い"))return "curse";
  if(t.includes("財宝")&&t.includes("勝利点"))return "treasure victory";
  if(t.includes("財宝"))return "treasure";
  if(t.includes("アクション")&&t.includes("勝利点"))return "action-victory";
  if(t.includes("アクション")&&t.includes("アタック"))return "action action-attack";
  if(t.includes("アクション"))return "action";
  if(t.includes("勝利点"))return "victory";
  return "";
}
function cardHTML(n,where="supply"){
  const c=CARDS[n], cnt=state.supply[n], bonus=cardBonusLine(n);
  return `<div class="card ${cardClass(n)}" data-name="${n}">
    <div class="cardTop"><span class="cardName">${n}</span><span>${where==="supply"?`<span class="pileCount">×${String(cnt??0).padStart(2,"0")}</span>`:""} <span class="cost">${cardCostLabel(n)}</span></span></div>
    <div class="cardType">${c.types.join("・")} / ${c.set}</div>
    <div class="cardText">${bonus || effectLineArray(c.text).map(x=>formatCardText(x)).join("<br>")}</div>
  </div>`;
}
function render(){
  if(!state.inGame)return;
  const h=state.players[0],c=state.players[1];
  document.getElementById("humanBox").classList.toggle("activeTurn",state.turn===0);
  document.getElementById("cpuBox").classList.toggle("activeTurn",state.turn===1);
  document.getElementById("humanStats").textContent=`手札 ${h.hand.length} / 勝利点 ${score(h)}${h.coffers?` / 財源 ${h.coffers}`:""}${h.villagers?` / 村人 ${h.villagers}`:""}${h.favors?` / 好意 ${h.favors}`:""}${h.debt?` / 負債 ${h.debt}`:""}`;
  document.getElementById("cpuStats").textContent=`手札 ${c.hand.length} / 勝利点 ${score(c)}${c.coffers?` / 財源 ${c.coffers}`:""}${c.villagers?` / 村人 ${c.villagers}`:""}${c.favors?` / 好意 ${c.favors}`:""}${c.debt?` / 負債 ${c.debt}`:""}`;
  document.getElementById("phaseLabel").textContent=state.turn===0?`あなた / ${state.phase==="action"?"アクション":"購入"}フェーズ`:`CPU 思考中`;
  document.getElementById("turnNums").textContent=`A ${state.actions} / B ${state.buys} / ¥ ${state.coins}${state.supply["ポーション"]!=null?` / P ${state.potions}`:""}${state.players[state.turn]?.debt?` / 負債 ${state.players[state.turn].debt}`:""}`;
  document.getElementById("playCount").textContent=`${h.play.length}枚`;
  document.getElementById("deckCountBig").textContent=`×${String(h.deck.length).padStart(2,"0")}`;
  const discardFace=h.lastPlayedDiscard;
  document.getElementById("discardFace").innerHTML=discardFace
    ? `<div class="discardNameOnly">${discardFace}</div>`
    : `<div class="discardEmpty">捨て札なし</div>`;
  const nextBtn=document.getElementById("nextPhaseBtn");
  nextBtn.textContent=state.phase==="action"?"購入フェーズ":(!state.treasuresCommitted?"財宝を出す":"ターン終了");
  const baseNames=["銅貨","銀貨","金貨","屋敷","公領","属州","呪い"];
  if(state.supply["ポーション"]!=null)baseNames.splice(3,0,"ポーション");
  if(state.supply["白金貨"]!=null)baseNames.splice(3,0,"白金貨");
  if(state.supply["植民地"]!=null)baseNames.splice(baseNames.indexOf("属州")+1,0,"植民地");
  document.getElementById("baseSupply").innerHTML=baseNames.map(n=>cardHTML(n)).join("");
  document.getElementById("kingdomSupply").innerHTML=state.kingdom.map(n=>cardHTML(n)).join("");
  document.getElementById("playCards").innerHTML=h.play.map((n,i)=>`<div class="card ${cardClass(n)}">
    <div class="cardTop"><span class="cardName">${n}</span><span class="cost">${cardCostLabel(n)}</span></div>
    <div class="cardType">${CARDS[n].types.join("・")}</div>
    <div class="cardText">${cardBonusLine(n) || effectLineArray(CARDS[n].text).map(x=>formatCardText(x)).join("<br>")}</div>
    <div class="playedMark">${i+1}</div>
  </div>`).join("");
  document.getElementById("handCards").innerHTML=h.hand.map((n,i)=>`<button class="card ${cardClass(n)}" data-hand="${i}">
    <div class="cardTop"><span class="cardName">${n}</span><span class="cost">${cardCostLabel(n)}</span></div>
    <div class="cardType">${CARDS[n].types.join("・")}</div><div class="cardText">${cardBonusLine(n) || effectLineArray(CARDS[n].text).map(x=>formatCardText(x)).join("<br>")}</div></button>`).join("");
  const humanTurn=state.turn===0&&!state.busy;
  document.getElementById("nextPhaseBtn").disabled=!humanTurn||!!state.supplyPick;
  document.querySelectorAll("#baseSupply .card,#kingdomSupply .card").forEach(el=>{
    const n=el.dataset.name;
    if(state.supplyPick){
      const target=state.supplyPick.choices.has(n);
      el.classList.toggle("gainTarget",target);
      el.classList.toggle("gainBlocked",!target);
      el.onclick=()=>{
        if(!target)return;
        const pick=state.supplyPick;state.supplyPick=null;
        pick.resolve(n);render();
      };
      return;
    }
    el.classList.remove("gainTarget","gainBlocked");
    const ok=humanTurn&&state.phase==="buy"&&state.treasuresCommitted&&canBuyCard(h,n);
    el.style.opacity=ok?"1":".72"; el.onclick=()=>{if(ok)buyCard(h,n);};
  });
  document.querySelectorAll("[data-hand]").forEach(el=>{
    el.onclick=async()=>{
      if(!humanTurn||state.supplyPick)return;
      const i=Number(el.dataset.hand),n=h.hand[i];
      if(state.phase==="action"&&typeHas(n,"アクション")&&state.actions>0){state.busy=true;await playActionFromHand(h,i);state.busy=false;render();}
      else if(state.phase==="buy"&&!state.treasuresCommitted&&typeHas(n,"財宝"))playTreasure(h,i);
      else if(state.phase==="buy"&&state.treasuresCommitted&&typeHas(n,"夜行")){state.busy=true;await playNightFromHand(h,i);state.busy=false;render();}
    };
  });
}
function groupCardCounts(list){
  const m={};
  for(const n of list)m[n]=(m[n]||0)+1;
  return Object.entries(m).sort((a,b)=>CARDS[a[0]].cost-CARDS[b[0]].cost || a[0].localeCompare(b[0],"ja"));
}
function inspectEntryHTML(n,c){
  const card=CARDS[n];
  if(!card)return "";
  return `<div class="inspectCardRow">
    <div class="inspectCardHead"><span class="inspectName">${n}</span><span class="cost">${cardCostLabel(n)}</span><span class="inspectQty">×${String(c).padStart(2,"0")}</span></div>
    <div class="inspectMeta">${card.types.join("・")} / ${card.set}</div>
    ${effectLinesHTML(card.text)}
  </div>`;
}
function inspectPlayer(index){
  const p=state.players[index];
  if(!p)return;
  const owned=allCards(p);
  const ownedHtml=groupCardCounts(owned).map(([n,c])=>inspectEntryHTML(n,c)).join("") || '<span class="inspectEmpty">カードなし</span>';
  const trashHtml=groupCardCounts(p.trash||[]).map(([n,c])=>inspectEntryHTML(n,c)).join("") || '<span class="inspectEmpty">廃棄したカードはありません</span>';
  modalOpen(`${p.name} のカード確認`, `所持カード ${owned.length}枚 / 廃棄 ${p.trash?.length||0}枚`,
    `<div class="inspectCols"><div class="inspectBox"><h4>デッキ構成</h4><div class="inspectCardList">${ownedHtml}</div></div><div class="inspectBox"><h4>廃棄したカード</h4><div class="inspectCardList">${trashHtml}</div></div></div>`,
    `<button id="inspectClose" class="mainbtn">閉じる</button>`);
  document.getElementById("inspectClose").onclick=modalClose;
}
function renderLog(){
  document.getElementById("logPanel").innerHTML=state.logs.length?state.logs.map(x=>`<div class="logLine">${x}</div>`).join(""):"まだログはありません。";
}
function renderSupplyPreview(){
  document.getElementById("supplyPreview").innerHTML=state.kingdom.length?
  `<b>選出王国カード：</b><br>${state.kingdom.map(n=>`${n}（${CARDS[n].set}）`).join(" / ")}`:"サプライ未生成";
}
function renderSetGrid(){
  const g=document.getElementById("setGrid");
  g.innerHTML=SETS.map(s=>`<label class="setItem ${s.enabled?"":"disabled"}">
    <input type="checkbox" data-set="${s.name}" ${state.selectedSets.has(s.name)?"checked":""} ${s.enabled?"":"disabled"}>
    <span><strong>${s.name}</strong><small>${s.note}</small></span>
  </label>`).join("");
}
function switchPanel(id){
  document.querySelectorAll(".panelView").forEach(x=>x.classList.toggle("active",x.id===id));
  document.querySelectorAll(".tabbtn").forEach(x=>x.classList.toggle("active",x.dataset.panel===id));
}
function enterRoom(){
  document.getElementById("titleScreen").classList.remove("active");document.getElementById("roomScreen").classList.add("active");
  document.getElementById("roomTabs").style.display="flex";renderSetGrid();buildSupply();renderLog();
}

function modalOpen(title,desc,html,footer=""){document.getElementById("modalTitle").textContent=title;document.getElementById("modalDesc").textContent=desc||"";document.getElementById("modalContent").innerHTML=html;document.getElementById("modalFooter").innerHTML=footer;document.getElementById("modalBack").classList.add("show");}
function modalClose(){document.getElementById("modalBack").classList.remove("show");}

function chooseCardsModal(title,desc,names,min,max,predicate=()=>true){
  return new Promise(resolve=>{
    let sel=new Set();
    const html=`<div class="choiceGrid">${names.map((n,i)=>`<button class="card ${cardClass(n)}" data-choice="${i}" ${predicate(i)?"":"disabled"}>${cardHTML(n,"choice").replace(/^<div[^>]*>|<\/div>$/g,"")}</button>`).join("")}</div>`;
    modalOpen(title,desc,html,`<button id="choiceOk" class="mainbtn">決定 0/${max}</button>`);
    const ok=document.getElementById("choiceOk"); ok.disabled=min>0;
    document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{
      const i=Number(b.dataset.choice);if(sel.has(i)){sel.delete(i);b.classList.remove("selected");}
      else if(sel.size<max){sel.add(i);b.classList.add("selected");}
      ok.textContent=`決定 ${sel.size}/${max}`;ok.disabled=sel.size<min;
    });
    ok.onclick=()=>{const out=[...sel];modalClose();resolve(out);};
  });
}
function optionModal(title,desc,opts){
  return new Promise(resolve=>{
    modalOpen(title,desc,`<div class="optionGrid">${opts.map((o,i)=>`<button class="optionBtn" data-opt="${i}">${o}</button>`).join("")}`);
    document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.opt);modalClose();resolve(i);});
  });
}

    const html=`<div class="revealDecision">
      <div class="card ${cardClass(name)} revealDecisionCard">${cardInner}</div>
      <div class="revealDecisionActions">

      const i=Number(b.dataset.revealOpt);
      modalClose();
      resolve(i);

function multiOptionModal(title,desc,opts,count){

    let s=new Set();

    const ok=document.getElementById("moptOk");

    ok.onclick=()=>{const a=[...s];modalClose();resolve(a);};
  });

function supplyModal(title,choices){

    modalOpen(title,"獲得するカードを選択",`<div class="choiceGrid">${choices.map(n=>`<button class="card ${cardClass(n)}" data-supplychoice="${n}">${cardHTML(n,"choice").replace(/^<div[^>]*>|<\/div>$/g,"")}</button>`).join("")}`);
    document.querySelectorAll("[data-supplychoice]").forEach(b=>b.onclick=()=>{const n=b.dataset.supplychoice;modalClose();resolve(n);});
  });
}
function cardNameModal(title,desc,names){
  return new Promise(resolve=>{
    modalOpen(title,desc,`<div class="choiceGrid">${names.map(n=>`<button class="card ${cardClass(n)}" data-namechoice="${n}">${cardHTML(n,"choice").replace(/^<div[^>]*>|<\/div>$/g,"")}</button>`).join("")}`);
    document.querySelectorAll("[data-namechoice]").forEach(b=>b.onclick=()=>{const n=b.dataset.namechoice;modalClose();resolve(n);});
  });
}

  document.getElementById("activeGame").style.display="none";document.getElementById("lobbyBox").style.display="block";
  renderSupplyPreview();switchPanel("gamePanel");
};
